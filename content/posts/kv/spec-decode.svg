<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" role="img" aria-label="Speculative decoding: a small model drafts 4 tokens one at a time; the big model scores all of them in one pass; the agreeing prefix is accepted, the first disagreement is replaced by the big model's token, and KV entries after it are discarded."><defs><marker id="m-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="m-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="m-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="m-cf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="m-57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0" y="0" width="1000" height="672" rx="12" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="24" y="34" font-size="19" fill="#1f2328" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Speculative decoding: one round (k = 4, greedy)</text><text x="24" y="56" font-size="13" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Text so far: “The cat sat on the”.  The last accepted token “the” is not in either KV cache yet.</text><text x="24" y="96" font-size="15" fill="#8250df" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">① Draft</text><text x="24" y="114" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">small model, 4 cheap</text><text x="24" y="130" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">steps, 1 token each</text><rect x="200" y="102" width="84" height="30" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="242.0" y="122" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the</text><rect x="300" y="102" width="84" height="30" rx="5" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="342.0" y="122" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><line x1="284" y1="117" x2="298" y2="117" stroke="#8250df" stroke-width="1.5" marker-end="url(#m-8250df)"/><rect x="400" y="102" width="84" height="30" rx="5" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="442.0" y="122" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><line x1="384" y1="117" x2="398" y2="117" stroke="#8250df" stroke-width="1.5" marker-end="url(#m-8250df)"/><rect x="500" y="102" width="84" height="30" rx="5" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="542.0" y="122" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fell</text><line x1="484" y1="117" x2="498" y2="117" stroke="#8250df" stroke-width="1.5" marker-end="url(#m-8250df)"/><rect x="600" y="102" width="84" height="30" rx="5" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="642.0" y="122" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">asleep</text><line x1="584" y1="117" x2="598" y2="117" stroke="#8250df" stroke-width="1.5" marker-end="url(#m-8250df)"/><text x="696" y="114" font-size="12" fill="#8250df" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">each guess is fed back</text><text x="696" y="130" font-size="12" fill="#8250df" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">to make the next guess</text><text x="24" y="174" font-size="15" fill="#0969da" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">② Verify</text><text x="24" y="192" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">big model, ONE pass</text><text x="24" y="208" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">over 5 tokens, like</text><text x="24" y="224" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">a small prefill</text><text x="192" y="200" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">input</text><rect x="200" y="180" width="84" height="30" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="242.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the</text><rect x="300" y="180" width="84" height="30" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="342.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><rect x="400" y="180" width="84" height="30" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="442.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><rect x="500" y="180" width="84" height="30" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="542.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fell</text><rect x="600" y="180" width="84" height="30" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="642.0" y="200" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">asleep</text><rect x="194" y="220" width="496" height="30" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1"/><text x="442" y="240" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">big model: causal attention over its KV cache + these 5 tokens</text><line x1="242" y1="210" x2="242" y2="220" stroke="#0969da" stroke-width="1.2"/><line x1="242" y1="250" x2="242" y2="268" stroke="#0969da" stroke-width="1.2" marker-end="url(#m-0969da)"/><line x1="342" y1="210" x2="342" y2="220" stroke="#0969da" stroke-width="1.2"/><line x1="342" y1="250" x2="342" y2="268" stroke="#0969da" stroke-width="1.2" marker-end="url(#m-0969da)"/><line x1="442" y1="210" x2="442" y2="220" stroke="#0969da" stroke-width="1.2"/><line x1="442" y1="250" x2="442" y2="268" stroke="#0969da" stroke-width="1.2" marker-end="url(#m-0969da)"/><line x1="542" y1="210" x2="542" y2="220" stroke="#0969da" stroke-width="1.2"/><line x1="542" y1="250" x2="542" y2="268" stroke="#0969da" stroke-width="1.2" marker-end="url(#m-0969da)"/><line x1="642" y1="210" x2="642" y2="220" stroke="#0969da" stroke-width="1.2"/><line x1="642" y1="250" x2="642" y2="268" stroke="#0969da" stroke-width="1.2" marker-end="url(#m-0969da)"/><text x="192" y="290" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">big model's</text><text x="192" y="305" font-size="12" fill="#57606a" text-anchor="end" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">next token</text><rect x="200" y="270" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="242.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><text x="242" y="318" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">= draft ✓</text><rect x="300" y="270" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="342.0" y="290" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><text x="342" y="318" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">= draft ✓</text><rect x="400" y="270" width="84" height="30" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="442.0" y="290" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">purred</text><text x="442" y="318" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">≠ “fell” ✗</text><rect x="500" y="270" width="84" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/><text x="542.0" y="290" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">asleep</text><text x="542" y="318" font-size="11" fill="#57606a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">ignored</text><rect x="600" y="270" width="84" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/><text x="642.0" y="290" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">.</text><text x="642" y="318" font-size="11" fill="#57606a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">ignored</text><text x="696" y="278" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">output i = the big model's choice</text><text x="696" y="294" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">given the text + drafts 1…i</text><text x="696" y="316" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the last two were computed after</text><text x="696" y="332" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">“fell”, which is wrong, so they</text><text x="696" y="348" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">are meaningless</text><text x="24" y="382" font-size="15" fill="#1a7f37" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">③ Emit</text><text x="24" y="400" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">3 tokens for one</text><text x="24" y="416" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">big-model pass</text><rect x="300" y="386" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="342.0" y="406" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><rect x="400" y="386" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="442.0" y="406" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><rect x="500" y="386" width="84" height="30" rx="5" fill="#ffebe9" stroke="#cf222e" stroke-width="1"/><text x="542.0" y="406" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">purred</text><text x="300" y="438" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">2 accepted drafts + the big model's correction</text><text x="696" y="400" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">if all 4 agree: 4 drafts + a bonus</text><text x="696" y="416" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">token = 5 tokens for one pass</text><text x="24" y="478" font-size="15" fill="#cf222e" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">④ Roll back both KV caches</text><text x="24" y="510" font-size="12" fill="#0969da" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">big model</text><rect x="116" y="490" width="76" height="30" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="154" y="510" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">prompt…</text><rect x="200" y="490" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="242.0" y="510" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the</text><rect x="300" y="490" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="342.0" y="510" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><rect x="400" y="490" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="442.0" y="510" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><rect x="500" y="490" width="84" height="30" rx="5" fill="#ffffff" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 3"/><text x="542.0" y="510" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fell</text><line x1="506" y1="516" x2="578" y2="494" stroke="#cf222e" stroke-width="1.5"/><rect x="600" y="490" width="84" height="30" rx="5" fill="#ffffff" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 3"/><text x="642.0" y="510" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">asleep</text><line x1="606" y1="516" x2="678" y2="494" stroke="#cf222e" stroke-width="1.5"/><text x="24" y="554" font-size="12" fill="#8250df" text-anchor="start" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">draft</text><rect x="116" y="534" width="76" height="30" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="154" y="554" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">prompt…</text><rect x="200" y="534" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="242.0" y="554" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">the</text><rect x="300" y="534" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="342.0" y="554" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">mat</text><rect x="400" y="534" width="84" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="442.0" y="554" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">and</text><rect x="500" y="534" width="84" height="30" rx="5" fill="#ffffff" stroke="#cf222e" stroke-width="1" stroke-dasharray="4 3"/><text x="542.0" y="554" font-size="13" fill="#cf222e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">fell</text><line x1="506" y1="560" x2="578" y2="538" stroke="#cf222e" stroke-width="1.5"/><rect x="600" y="534" width="84" height="30" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/><text x="642.0" y="554" font-size="13" fill="#57606a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">asleep</text><text x="692" y="554" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">never fed in, never cached</text><text x="300" y="592" font-size="12" fill="#1a7f37" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">K/V of position i depend only on tokens ≤ i (causal), so entries up to “and” are still valid: keep them.</text><text x="300" y="610" font-size="12" fill="#cf222e" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">K/V built on the wrong token “fell” and after it: cut off the end of each cache (just shorten its length).</text><text x="300" y="628" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Next round starts from “purred”: it is not in either cache yet, exactly like “the” at the top.</text><text x="300" y="646" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">The draft model now guesses again from “purred”, so all its later guesses change.</text></svg>